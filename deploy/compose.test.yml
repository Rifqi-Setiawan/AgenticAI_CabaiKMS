# Disposable integration database ONLY. Bind to loopback; never use this password in production.
services:
  postgres-test:
    image: postgres:16
    environment:
      POSTGRES_DB: cabai_kms_test
      POSTGRES_USER: cabai_test
      POSTGRES_PASSWORD: local_disposable_test_only
    ports:
      - "127.0.0.1:54329:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cabai_test -d cabai_kms_test"]
      interval: 2s
      timeout: 2s
      retries: 30
