# Row -> domain mapping for the canonical template (data/canonical/template_kanonik.xlsx).
#
# WHY THIS FILE EXISTS: "domain" is not predicted by any agent. It is looked up
# from this file for whichever canonical row a value belongs to, and used only for
# (1) extra context injected into LLM prompts and (2) Macro-F1 grouped by category
# during evaluation. See docs/DESIGN_DECISIONS.md (b).
#
# Domains: vegetatif, daun, bunga, buah, biji, lokasi. Confirmed with the user
# 2026-07-20: buah/biji are separate domains (not a merged "buah_biji"), and the
# four image rows (Gambar Daun/Batang/Buah/Bunga) each reuse the domain of the
# plant part they depict rather than sharing one generic "path_citra" bucket —
# e.g. Gambar Daun -> daun, Gambar Buah -> buah. Gambar Batang -> vegetatif since
# "batang" itself has no dedicated domain (it's one vegetatif row, #5).
#
# Matching key is `label` (the "Karakter" column text), NOT `row` number.
# Labels are stable identifiers; row numbers shift if rows are inserted/reordered
# in the template. `row` is recorded here only as a human cross-reference to the
# template as of the date below and MUST NOT be relied on by code.
#
# N (row count) is READ DYNAMICALLY from the template at runtime — this file is
# expected to grow past 60 entries whenever new canonical rows are added, and
# nothing in src/ should assume a fixed length for this list.
#
# Domain values are NOT an enum defined elsewhere: code must derive the set of
# valid domains by collecting the unique `domain` values actually present below.
#
# If a future row's category is genuinely unclear, set `domain: unassigned` and
# raise it in docs/OPEN_QUESTIONS.md instead of guessing.
#
# NORMALIZATION WARNING: several labels in the actual template have inconsistent
# leading/trailing whitespace (e.g. "bentuk ujung daun ", "warna mahkota ").
# Labels below are stored TRIMMED. Any code matching a template cell against this
# file MUST strip() the template's label before comparing.

# as_of_row_count: snapshot of the template's row count when this file was last
# reconciled against it. Used only to detect drift (template grew/shrunk without
# this file being updated) — never used as the source of truth for N.
as_of_row_count: 60

