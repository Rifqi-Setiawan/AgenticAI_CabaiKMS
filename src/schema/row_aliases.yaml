# Manually-curated alternate labels ("alias") per canonical row.
#
# WHY THIS FILE EXISTS: source spreadsheets label the same character
# differently across formats/collectors (e.g. "tinggi tanaman" vs "tinggi
# batang" vs "plant height"). alt_labels lets the schema-mapping agent
# recognize a source column/row header as matching a canonical row even
# when the exact text differs, without hardcoding synonyms in Python.
#
# Matching key is `label` (trimmed "Karakter" text), same convention as
# row_domains.yaml. Fill aliases in manually as real-world label variants
# are observed in raw samples. A missing or empty list is not an error; it
# just means no aliases are known yet for that row.

